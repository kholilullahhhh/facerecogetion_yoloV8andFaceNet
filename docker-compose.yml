version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    environment:
      POSTGRES_DB: attendance_face_recognition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-backend
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: attendance_face_recognition
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: attendance-ai-service
    ports:
      - "8001:8000"
    environment:
      AI_PORT: 8000
      DEVICE: cpu
      FACE_MATCH_THRESHOLD: "0.8"
    volumes:
      - ./ai-service:/app
      - ai_weights:/app/weights

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  ai_weights:
